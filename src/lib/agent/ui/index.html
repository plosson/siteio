<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>siteio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><defs><linearGradient id='b' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%232DB878'/><stop offset='1' stop-color='%231F9D63'/></linearGradient></defs><rect width='256' height='256' rx='57' fill='url(%23b)'/><path d='M66 38 H188 L214 64 V196 Q214 218 192 218 H66 Q42 218 42 196 V60 Q42 38 66 38 Z' fill='%23F8F0E0'/><rect x='82' y='38' width='100' height='62' rx='8' fill='%23283030'/><rect x='64' y='118' width='128' height='80' rx='14' fill='%23283030'/><rect x='64' y='118' width='128' height='16' rx='8' fill='%231F9D63'/><rect x='80' y='150' width='58' height='9' rx='4.5' fill='%23FFB547'/></svg>" />
  <link rel="stylesheet" href="/ui/ui.css" />
  <script defer src="/ui/chat-core.js"></script>
  <script defer src="/ui/ui.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.15.3/dist/cdn.min.js"></script>
</head>
<body x-data="siteioAdmin()" @keydown.window="onKey($event)">

  <!-- Gate -->
  <template x-if="!authed">
    <main id="login-view" class="gate">
      <div class="gate-box">
        <div class="gate-lockup">
          <svg viewBox="0 0 256 256" aria-hidden="true">
            <defs>
              <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DB878"/><stop offset="1" stop-color="#1F9D63"/></linearGradient>
              <linearGradient id="gbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EC"/><stop offset="1" stop-color="#EEE2CA"/></linearGradient>
              <linearGradient id="gdark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2526"/><stop offset="1" stop-color="#343C3D"/></linearGradient>
            </defs>
            <rect width="256" height="256" rx="57" fill="url(#gbg)"/>
            <path d="M66 38 H188 L214 64 V196 Q214 218 192 218 H66 Q42 218 42 196 V60 Q42 38 66 38 Z" fill="url(#gbody)"/>
            <rect x="82" y="38" width="100" height="62" rx="8" fill="#283030"/>
            <rect x="140" y="50" width="24" height="38" rx="6" fill="#151A1B"/>
            <rect x="64" y="118" width="128" height="80" rx="14" fill="url(#gdark)"/>
            <rect x="64" y="118" width="128" height="16" rx="8" fill="#2DB878"/>
            <rect x="64" y="126" width="128" height="8" fill="#1F9D63"/>
            <rect x="80" y="150" width="58" height="9" rx="4.5" fill="#FFB547"/>
            <rect x="80" y="170" width="36" height="9" rx="4.5" fill="#FFB547" opacity="0.55"/>
          </svg>
          <span>siteio</span>
        </div>
        <h1>Sign in to continue</h1>
        <p class="muted mt-1">Enter the API key of this server.</p>
        <form @submit.prevent="login()" class="stack" novalidate>
          <div class="field">
            <label for="apiKeyInput">API key</label>
            <input id="apiKeyInput" type="password" class="input input-mono" x-model="apiKeyInput"
                   x-init="$nextTick(() => $el.focus())" autocomplete="off"
                   :aria-invalid="loginError ? 'true' : 'false'" aria-describedby="login-error" />
            <template x-if="loginError">
              <p id="login-error" class="field-error" x-text="'✗ ' + loginError"></p>
            </template>
          </div>
          <button type="submit" class="btn btn-strong" :disabled="loginPending">
            <span x-text="loginPending ? 'Signing in…' : 'Sign in'"></span>
          </button>
          <p class="help">Lost the key? Run <code>siteio ui</code> on a computer that is signed in, or <code>siteio agent config get apiKey</code> on the server.</p>
        </form>
      </div>
    </main>
  </template>

  <template x-if="authed">
    <div>
      <header class="header">
        <div class="header-bar">
          <a href="#/" class="lockup" aria-label="siteio overview">
            <svg viewBox="0 0 256 256" aria-hidden="true">
              <defs>
                <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2DB878"/><stop offset="1" stop-color="#1F9D63"/></linearGradient>
                <linearGradient id="hbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF9EC"/><stop offset="1" stop-color="#EEE2CA"/></linearGradient>
                <linearGradient id="hdark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F2526"/><stop offset="1" stop-color="#343C3D"/></linearGradient>
              </defs>
              <rect width="256" height="256" rx="64" fill="url(#hbg)"/>
              <path d="M66 38 H188 L214 64 V196 Q214 218 192 218 H66 Q42 218 42 196 V60 Q42 38 66 38 Z" fill="url(#hbody)"/>
              <rect x="82" y="38" width="100" height="62" rx="8" fill="#283030"/>
              <rect x="140" y="50" width="24" height="38" rx="6" fill="#151A1B"/>
              <rect x="64" y="118" width="128" height="80" rx="14" fill="url(#hdark)"/>
              <rect x="64" y="118" width="128" height="16" rx="8" fill="#2DB878"/>
              <rect x="64" y="126" width="128" height="8" fill="#1F9D63"/>
              <rect x="80" y="150" width="58" height="9" rx="4.5" fill="#FFB547"/>
              <rect x="80" y="170" width="36" height="9" rx="4.5" fill="#FFB547" opacity="0.55"/>
            </svg>
            <span>siteio</span>
          </a>
          <div class="where">
            <span class="where-name" x-text="serverName()" :title="serverName()"></span>
            <button type="button" class="btn-link" @click="logout()">Sign out</button>
          </div>
        </div>
        <nav class="tabs" aria-label="Sections">
          <a href="#/" :aria-current="section() === 'overview' ? 'page' : null">Overview</a>
          <a href="#/sites" :aria-current="section() === 'sites' ? 'page' : null">Sites</a>
          <template x-if="appsEnabled()">
            <a href="#/apps" :aria-current="section() === 'apps' ? 'page' : null">Apps</a>
          </template>
          <a href="#/settings" :aria-current="section() === 'settings' ? 'page' : null">Settings</a>
        </nav>
      </header>

      <main class="page" id="main-content">
        <!-- Problem banner: the server can't be reached -->
        <template x-if="unreachable">
          <div class="banner banner-warn row-between" role="alert">
            <span>✗ Can't reach the server.<span x-show="lastLoadedAt" x-text="' Last loaded at ' + formatClock(lastLoadedAt) + '.'"></span></span>
            <button type="button" class="btn btn-small" @click="onRouteEnter()">Try again</button>
          </div>
        </template>

        <!-- Overview -->
        <template x-if="route.view === 'overview'">
          <div class="stack">
            <template x-if="attention().length > 0">
              <div class="banner banner-warn" role="status">
                <strong x-text="'! ' + attention().length + (attention().length === 1 ? ' needs attention: ' : ' need attention: ')"></strong>
                <template x-for="(item, i) in attention()" :key="item.kind + ':' + item.name">
                  <span><a :href="serviceHref(item)" x-text="item.name"></a> <span x-text="attentionLabel(item)"></span><span x-text="i < attention().length - 1 ? ' · ' : ''"></span></span>
                </template>
              </div>
            </template>
            <div class="cols">
              <section class="stack" aria-labelledby="overview-title">
                <h1 id="overview-title">Overview</h1>
                <div class="display">
                  <div class="display-label">Your server</div>
                  <span class="display-value" x-text="serverName()"></span>
                </div>
                <p class="status" :class="overviewStatus().cls">
                  <span x-text="overviewStatus().text"></span>
                  <span class="muted" x-show="pending.has('services-list') && services !== null">· ⟳ Updating…</span>
                </p>
                <div class="actions">
                  <button type="button" class="btn" @click="copy(serverName(), 'Server address copied')">Copy address</button>
                </div>
                <div class="card">
                  <h2>Deploy a site</h2>
                  <div class="stack-s">
                    <p class="muted">Run this in the folder you want to publish.</p>
                    <div class="code"><code>siteio sites deploy ./dist</code><button type="button" class="btn btn-small" @click="copy('siteio sites deploy ./dist', 'Command copied')">Copy</button></div>
                  </div>
                </div>
              </section>
              <section class="stack-s" aria-labelledby="activity-title">
                <h2 id="activity-title">Recent deploys</h2>
                <template x-if="services === null">
                  <p class="muted">⟳ Loading…</p>
                </template>
                <template x-if="services && recentDeploys().length === 0">
                  <div class="empty">No deploys yet. They will appear here as soon as you deploy a site or an app.</div>
                </template>
                <template x-if="services && recentDeploys().length > 0">
                  <div class="stack-s">
                    <ul class="list">
                      <template x-for="item in recentDeploys().slice(0, activityLimit)" :key="item.kind + ':' + item.name">
                        <li>
                          <a class="list-row" :href="serviceHref(item)" :data-service-name="item.name">
                            <span class="dot" :class="isRecent(item.deployedAt) ? 'dot-new' : ''" aria-hidden="true"></span>
                            <span class="grow">
                              <span class="list-title" x-text="item.name"></span>
                              <span class="list-meta" x-text="(item.kind === 'site' ? 'Site' : 'App') + ' · deployed ' + formatRelativeTime(item.deployedAt)" :title="formatAbsoluteTime(item.deployedAt)"></span>
                            </span>
                            <span class="status" :class="statusClass(item)" x-text="statusText(item)"></span>
                          </a>
                        </li>
                      </template>
                    </ul>
                    <template x-if="recentDeploys().length > activityLimit">
                      <button type="button" class="btn" @click="activityLimit += 20">Show 20 more</button>
                    </template>
                  </div>
                </template>
              </section>
            </div>
          </div>
        </template>

        <!-- Collection: sites or apps -->
        <template x-if="(route.view === 'sites' || route.view === 'apps') && !route.param">
          <section class="stack">
            <div class="row-between">
              <h1><span x-text="route.view === 'sites' ? 'Sites' : 'Apps'"></span><span class="count" x-show="services" x-text="collection().length"></span></h1>
              <span class="muted" x-show="pending.has('services-list') && services !== null">⟳ Updating…</span>
            </div>
            <div class="row-between">
              <div class="field filter grow">
                <label for="filterInput" class="sr-only">Filter</label>
                <input id="filterInput" x-ref="filterEl" type="search" class="input" placeholder="Filter  ( / )" x-model="filterText" />
              </div>
              <div class="code">
                <code x-text="route.view === 'sites' ? 'siteio sites deploy ./dist' : 'siteio apps create myapp -i nginx -p 80'"></code>
                <button type="button" class="btn btn-small" @click="copy(route.view === 'sites' ? 'siteio sites deploy ./dist' : 'siteio apps create myapp -i nginx -p 80', 'Command copied')">Copy</button>
              </div>
            </div>

            <template x-if="services === null">
              <p class="muted">⟳ Loading…</p>
            </template>
            <template x-if="services && collection().length === 0">
              <div class="empty" x-show="route.view === 'sites'">No sites yet. Deploy one with <code>siteio sites deploy ./dist</code>.</div>
            </template>
            <template x-if="services && collection().length === 0">
              <div class="empty" x-show="route.view === 'apps'">No apps yet. Create one with <code>siteio apps create myapp -i nginx -p 80</code>.</div>
            </template>
            <template x-if="services && collection().length > 0 && filteredCollection().length === 0">
              <div class="empty">Nothing matches “<span x-text="filterText"></span>”.</div>
            </template>
            <template x-if="services && filteredCollection().length > 0">
              <ul class="list">
                <template x-for="item in filteredCollection()" :key="item.kind + ':' + item.name">
                  <li>
                    <a class="list-row" :href="serviceHref(item)" :data-service-name="item.name">
                      <span class="thumb" aria-hidden="true">
                        <template x-if="thumbs[item.kind + ':' + item.name]">
                          <img :src="thumbs[item.kind + ':' + item.name]" alt="" />
                        </template>
                        <template x-if="!thumbs[item.kind + ':' + item.name]">
                          <span x-text="item.kind"></span>
                        </template>
                      </span>
                      <span class="grow">
                        <span class="list-title" x-text="item.name"></span>
                        <span class="list-meta" x-text="servicePrimaryDomain(item)"></span>
                        <span class="list-meta" x-text="serviceMeta(item)"></span>
                      </span>
                      <span class="list-side">
                        <span class="status" :class="statusClass(item)" x-text="statusText(item)"></span>
                        <span class="list-meta" x-text="item.deployedAt ? 'Deployed ' + formatRelativeTime(item.deployedAt) : 'Not deployed yet'" :title="formatAbsoluteTime(item.deployedAt)"></span>
                      </span>
                    </a>
                  </li>
                </template>
              </ul>
            </template>
          </section>
        </template>

        <!-- Settings -->
        <template x-if="route.view === 'settings'">
          <section class="stack">
            <h1>Settings</h1>
            <template x-if="agentInfo === null">
              <p class="muted">⟳ Loading…</p>
            </template>
            <template x-if="agentInfo">
              <div class="stack">
                <div class="card">
                  <h2>About this server</h2>
                  <dl class="kv">
                    <dt>Address</dt><dd class="mono" x-text="agentInfo.domain"></dd>
                    <dt>Version</dt><dd class="mono" x-text="agentInfo.version"></dd>
                    <dt>Email for HTTPS</dt><dd x-text="agentInfo.email || 'Not set'"></dd>
                    <dt>Sites</dt><dd x-text="agentInfo.siteCount"></dd>
                    <dt>Apps</dt><dd x-text="agentInfo.appCount"></dd>
                    <dt>Data folder</dt><dd class="mono" x-text="agentInfo.dataDir"></dd>
                    <dt>HTTP / HTTPS ports</dt><dd class="mono" x-text="agentInfo.httpPort + ' / ' + agentInfo.httpsPort"></dd>
                    <dt>Largest upload</dt><dd x-text="formatBytes(agentInfo.maxUploadSize)"></dd>
                  </dl>
                </div>
                <div class="card">
                  <h2>Optional features</h2>
                  <dl class="kv">
                    <dt>Apps</dt>
                    <dd>
                      <span class="status" :class="agentInfo.appsEnabled ? 'status-ok' : 'status-neutral'" x-text="agentInfo.appsEnabled ? '✓ On' : '○ Off'"></span>
                      <template x-if="!agentInfo.appsEnabled">
                        <p class="help">Run Docker apps next to your sites. Turn on with <code>siteio agent config set appsEnabled true</code>, then restart the agent.</p>
                      </template>
                    </dd>
                    <dt>AI editing</dt>
                    <dd>
                      <span class="status" :class="agentInfo.chat && agentInfo.chat.configured ? 'status-ok' : 'status-neutral'" x-text="agentInfo.chat && agentInfo.chat.configured ? '✓ On' : '○ Off'"></span>
                      <template x-if="agentInfo.chat && agentInfo.chat.configured">
                        <span class="muted" x-text="' · ' + [agentInfo.chat.provider, agentInfo.chat.model, agentInfo.chat.sandbox ? 'sandboxed' : 'not sandboxed'].filter(Boolean).join(' · ')"></span>
                      </template>
                      <template x-if="!(agentInfo.chat && agentInfo.chat.configured)">
                        <p class="help">Edit a site by describing a change. Turn on with <code>siteio agent config set llmOauthToken &lt;token&gt;</code> (from <code>claude setup-token</code>), then restart the agent.</p>
                      </template>
                    </dd>
                  </dl>
                </div>
                <div class="note">These settings are changed on the server with <code>siteio agent config set &lt;key&gt; &lt;value&gt;</code>, then <code>siteio agent restart</code>.</div>
              </div>
            </template>
          </section>
        </template>

        <!-- Detail: one site or app -->
        <template x-if="(route.view === 'sites' || route.view === 'apps') && route.param">
          <section class="stack">
            <p class="path">
              <a :href="'#/' + route.view" x-text="route.view === 'sites' ? 'Sites' : 'Apps'"></a> / <span x-text="route.param"></span>
            </p>

            <template x-if="detail() === null">
              <div class="stack-s">
                <h1 x-text="route.param"></h1>
                <p class="muted">⟳ Loading…</p>
              </div>
            </template>

            <template x-if="detail() === 'not-found'">
              <div class="stack-s">
                <h1 x-text="(route.view === 'sites' ? 'Site' : 'App') + ' not found'"></h1>
                <p class="muted">It was removed or renamed.</p>
                <p><a :href="'#/' + route.view" x-text="'Back to ' + (route.view === 'sites' ? 'sites' : 'apps')"></a></p>
              </div>
            </template>

            <template x-if="detail() && detail() !== 'not-found'">
              <div class="stack">
                <div class="row-between">
                  <div class="row">
                    <h1 x-text="route.param"></h1>
                    <span class="status" :class="statusClass(detail())" x-text="statusText(detail())"></span>
                  </div>
                  <div class="actions actions-stack">
                    <template x-if="route.view === 'apps'">
                      <div class="actions actions-stack">
                        <button type="button" class="btn" :disabled="anyAppActionPending()" @click="stopApp(route.param)"
                                x-text="pending.has('stop') ? 'Stopping…' : 'Stop'"></button>
                        <button type="button" class="btn" :disabled="anyAppActionPending()" @click="restartApp(route.param)"
                                x-text="pending.has('restart') ? 'Restarting…' : 'Restart'"></button>
                        <button type="button" class="btn btn-primary" :disabled="anyAppActionPending()" @click="deployApp(route.param)"
                                x-text="pending.has('deploy') ? 'Deploying…' : 'Deploy now'"></button>
                      </div>
                    </template>
                    <template x-if="route.view === 'sites' && selectedSite.chatEnabled">
                      <button type="button" class="btn btn-primary" @click="openLiveEditor(route.param)" :disabled="pending.has('editlink-' + route.param)">Open live editor</button>
                    </template>
                  </div>
                </div>

                <div class="display">
                  <div class="display-label" x-text="route.view === 'sites' ? 'Your site' : 'Your app'"></div>
                  <a class="display-value" :href="detail().url" target="_blank" rel="noreferrer" x-text="detail().url + ' ↗'"></a>
                  <template x-if="(detail().domains || []).length > 1">
                    <div class="display-second" x-text="'Also at ' + detail().domains.slice(1).join(', ')"></div>
                  </template>
                </div>

                <nav class="subtabs tabs" aria-label="Parts of this object">
                  <template x-for="t in detailTabs()" :key="t.k">
                    <a :href="'#/' + route.view + '/' + route.param + '/' + t.k" :aria-current="currentTab() === t.k ? 'page' : null" x-text="t.label"></a>
                  </template>
                </nav>

                <!-- Site: overview -->
                <template x-if="route.view === 'sites' && currentTab() === 'overview'">
                  <div class="cols">
                    <div class="stack">
                      <div class="card">
                        <h2>Details</h2>
                        <dl class="kv">
                          <dt>Version</dt><dd x-text="selectedSite.version ? 'v' + selectedSite.version : 'None yet'"></dd>
                          <dt>Deployed</dt><dd x-text="formatRelativeTime(selectedSite.deployedAt) || 'Not yet'" :title="formatAbsoluteTime(selectedSite.deployedAt)"></dd>
                          <dt>Size</dt><dd x-text="formatBytes(selectedSite.size)"></dd>
                          <dt>HTTPS</dt><dd><span class="status" :class="tlsInfo(selectedSite.tls).cls" x-text="tlsInfo(selectedSite.tls).text"></span></dd>
                          <dt>Custom domains</dt>
                          <dd>
                            <template x-if="(selectedSite.domains || []).length === 0"><span class="muted">None. Add one with <code x-text="'siteio sites domain ' + route.param + ' add example.com'"></code></span></template>
                            <template x-for="d in (selectedSite.domains || [])" :key="d">
                              <a :href="'https://' + d" target="_blank" rel="noreferrer" class="mono" x-text="d"></a>
                            </template>
                          </dd>
                        </dl>
                      </div>
                      <div class="card">
                        <h2>Backend</h2>
                        <dl class="kv">
                          <dt>Database</dt><dd x-text="'PocketBase ' + selectedSite.pocketbaseVersion"></dd>
                          <dt>Database admin</dt><dd><a :href="selectedSite.adminUrl" target="_blank" rel="noreferrer" class="mono" x-text="selectedSite.adminUrl"></a></dd>
                        </dl>
                      </div>
                      <div class="card danger">
                        <h2>Danger zone</h2>
                        <div class="row-between">
                          <p class="muted grow">Remove this site, its files and its data. This can't be undone.</p>
                          <button type="button" class="btn btn-danger" :disabled="pending.has('undeploy')" @click="undeploySite(route.param)">Remove site</button>
                        </div>
                      </div>
                    </div>
                    <div class="stack-s" x-data="{ k: 'site:' + route.param }">
                      <div class="row-between">
                        <h2>Preview</h2>
                        <button type="button" class="btn btn-small" :disabled="pending.has('thumb:' + k)" @click="refreshThumbnail({ kind: 'site', name: route.param })"
                                x-text="pending.has('thumb:' + k) ? '⟳ Refreshing…' : 'Refresh'"></button>
                      </div>
                      <div class="preview">
                        <template x-if="thumbs[k]"><img :src="thumbs[k]" alt="Preview of the site" /></template>
                        <template x-if="!thumbs[k]"><span class="small">No preview yet</span></template>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- App: overview -->
                <template x-if="route.view === 'apps' && currentTab() === 'overview'">
                  <div class="cols">
                    <div class="stack">
                      <template x-if="selectedApp.autoDeployError">
                        <div class="banner banner-warn" role="status">
                          <strong>! Auto-deploy failed.</strong> <span x-text="selectedApp.autoDeployError"></span>
                        </div>
                      </template>
                      <div class="card">
                        <h2>Source</h2>
                        <dl class="kv">
                          <template x-if="selectedApp.compose">
                            <div>
                              <dt>Compose</dt><dd x-text="selectedApp.compose.source"></dd>
                              <dt>Main part</dt><dd class="mono" x-text="selectedApp.compose.primaryService"></dd>
                              <template x-if="selectedApp.compose.path"><dt>File</dt></template>
                              <template x-if="selectedApp.compose.path"><dd class="mono" x-text="selectedApp.compose.path"></dd></template>
                            </div>
                          </template>
                          <template x-if="selectedApp.git && !selectedApp.compose">
                            <div>
                              <dt>Git</dt><dd class="mono" x-text="selectedApp.git.repoUrl"></dd>
                              <dt>Branch</dt><dd class="mono" x-text="selectedApp.git.branch"></dd>
                              <dt>Dockerfile</dt><dd class="mono" x-text="selectedApp.git.dockerfile"></dd>
                              <template x-if="selectedApp.git.context"><dt>Folder</dt></template>
                              <template x-if="selectedApp.git.context"><dd class="mono" x-text="selectedApp.git.context"></dd></template>
                              <template x-if="selectedApp.git.tokenSet"><dt>Access token</dt></template>
                              <template x-if="selectedApp.git.tokenSet"><dd>Set</dd></template>
                            </div>
                          </template>
                          <template x-if="selectedApp.dockerfile && !selectedApp.git && !selectedApp.compose">
                            <div><dt>Build</dt><dd>Dockerfile sent from the command line</dd></div>
                          </template>
                          <template x-if="!selectedApp.compose && !selectedApp.git && !selectedApp.dockerfile">
                            <div><dt>Image</dt><dd class="mono" x-text="selectedApp.image"></dd></div>
                          </template>
                        </dl>
                      </div>
                      <div class="card">
                        <h2>Routing</h2>
                        <dl class="kv">
                          <dt>Port in the container</dt><dd class="mono" x-text="selectedApp.internalPort"></dd>
                          <dt>Custom domains</dt>
                          <dd>
                            <template x-if="(selectedApp.domains || []).length === 0"><span class="muted">None</span></template>
                            <template x-for="d in (selectedApp.domains || [])" :key="d">
                              <a :href="'https://' + d" target="_blank" rel="noreferrer" class="mono" x-text="d"></a>
                            </template>
                          </dd>
                          <dt>Restart policy</dt><dd class="mono" x-text="selectedApp.restartPolicy || 'unless-stopped'"></dd>
                        </dl>
                      </div>
                      <div class="card">
                        <h2>Environment</h2>
                        <template x-if="envKeys().length === 0">
                          <p class="muted">No environment variables. Set them with <code x-text="'siteio apps set ' + route.param + ' -e KEY=value'"></code></p>
                        </template>
                        <template x-if="envKeys().length > 0">
                          <dl class="kv">
                            <template x-for="k in envKeys()" :key="k">
                              <div>
                                <dt class="mono" x-text="k"></dt>
                                <dd class="mono" :class="isSecret(k) ? 'muted' : ''" x-text="isSecret(k) ? 'Set · hidden' : selectedApp.env[k]"></dd>
                              </div>
                            </template>
                          </dl>
                        </template>
                      </div>
                      <div class="card">
                        <h2>Volumes</h2>
                        <template x-if="(selectedApp.volumes || []).length === 0">
                          <p class="muted">No volumes.</p>
                        </template>
                        <template x-if="(selectedApp.volumes || []).length > 0">
                          <dl class="kv">
                            <template x-for="v in selectedApp.volumes" :key="v.name + ':' + v.mountPath">
                              <div>
                                <dt class="mono" x-text="v.name"></dt>
                                <dd class="mono" x-text="v.mountPath + (v.readonly ? ' (read-only)' : '')"></dd>
                              </div>
                            </template>
                          </dl>
                        </template>
                      </div>
                      <div class="card danger">
                        <h2>Danger zone</h2>
                        <div class="row-between">
                          <p class="muted grow">Remove this app, its container and its image. This can't be undone.</p>
                          <button type="button" class="btn btn-danger" :disabled="anyAppActionPending()" @click="removeApp(route.param)">Remove app</button>
                        </div>
                      </div>
                    </div>
                    <div class="stack">
                      <div class="card">
                        <h2>Deploys</h2>
                        <dl class="kv">
                          <dt>Created</dt><dd x-text="formatRelativeTime(selectedApp.createdAt) || 'Unknown'" :title="formatAbsoluteTime(selectedApp.createdAt)"></dd>
                          <dt>Deployed</dt><dd x-text="formatRelativeTime(selectedApp.deployedAt) || 'Not yet'" :title="formatAbsoluteTime(selectedApp.deployedAt)"></dd>
                          <template x-if="selectedApp.commitHash"><dt>Commit</dt></template>
                          <template x-if="selectedApp.commitHash"><dd class="mono" x-text="selectedApp.commitHash.substring(0, 7)"></dd></template>
                          <template x-if="selectedApp.lastBuildAt"><dt>Last build</dt></template>
                          <template x-if="selectedApp.lastBuildAt"><dd x-text="formatRelativeTime(selectedApp.lastBuildAt)" :title="formatAbsoluteTime(selectedApp.lastBuildAt)"></dd></template>
                          <template x-if="selectedApp.containerId"><dt>Container</dt></template>
                          <template x-if="selectedApp.containerId"><dd class="mono" x-text="selectedApp.containerId.substring(0, 12)"></dd></template>
                        </dl>
                      </div>
                      <div class="stack-s" x-data="{ k: 'app:' + route.param }">
                        <div class="row-between">
                          <h2>Preview</h2>
                          <button type="button" class="btn btn-small" :disabled="pending.has('thumb:' + k)" @click="refreshThumbnail({ kind: 'app', name: route.param })"
                                  x-text="pending.has('thumb:' + k) ? '⟳ Refreshing…' : 'Refresh'"></button>
                        </div>
                        <div class="preview">
                          <template x-if="thumbs[k]"><img :src="thumbs[k]" alt="Preview of the app" /></template>
                          <template x-if="!thumbs[k]"><span class="small">No preview yet</span></template>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Site: history -->
                <template x-if="route.view === 'sites' && currentTab() === 'history'">
                  <div class="stack-s">
                    <p class="muted small">The last 10 versions are kept. Restoring a version brings back its files; the site's data stays as it is now.</p>
                    <ul class="list">
                      <li class="list-row" data-current>
                        <span class="grow">
                          <span class="list-title" x-text="'v' + (selectedSite.version || '–')"></span>
                          <span class="list-meta" x-text="formatRelativeTime(selectedSite.deployedAt)" :title="formatAbsoluteTime(selectedSite.deployedAt)"></span>
                        </span>
                        <span class="version-live">✓ Live</span>
                      </li>
                      <template x-if="siteHistory === null">
                        <li class="list-row muted">⟳ Loading older versions…</li>
                      </template>
                      <template x-for="v in (siteHistory || [])" :key="v.version">
                        <li class="list-row" :data-version="v.version">
                          <span class="grow">
                            <span class="list-title" x-text="'v' + v.version + (v.message ? ' · ' + v.message : '')" dir="auto"></span>
                            <span class="list-meta" x-text="[formatRelativeTime(v.deployedAt), v.deployedBy, formatBytes(v.size)].filter(Boolean).join(' · ')" :title="formatAbsoluteTime(v.deployedAt)"></span>
                          </span>
                          <template x-if="v.version === selectedSite.version"><span class="version-live">✓ Live</span></template>
                          <template x-if="v.version !== selectedSite.version">
                            <button type="button" class="btn btn-small" :disabled="pending.has('rollback-' + v.version)" @click="restoreVersion(route.param, v.version)"
                                    x-text="pending.has('rollback-' + v.version) ? 'Restoring…' : 'Restore'"></button>
                          </template>
                        </li>
                      </template>
                      <template x-if="siteHistory && siteHistory.length === 0">
                        <li class="list-row muted">No older versions yet. Each new deploy keeps the previous one here.</li>
                      </template>
                    </ul>
                  </div>
                </template>

                <!-- Logs (sites and apps) -->
                <template x-if="currentTab() === 'logs'">
                  <div>
                    <div class="logs-toolbar">
                      <label class="switch">
                        <input type="checkbox" role="switch" x-model="logsAuto" @change="logsAuto ? startLogsPoll() : stopLogsPoll()" />
                        <span x-text="logsAuto ? 'Following' : 'Paused'"></span>
                      </label>
                      <div class="grow filter">
                        <label for="logsFilter" class="sr-only">Highlight lines</label>
                        <input id="logsFilter" type="search" class="input" placeholder="Highlight" x-model="logsFilter" />
                      </div>
                      <button type="button" class="btn btn-small" @click="copy(logs, 'Logs copied')" :disabled="!logs">Copy</button>
                      <button type="button" class="btn btn-small" @click="downloadLogs(route.param)" :disabled="!logs">Download</button>
                    </div>
                    <pre class="logs" x-ref="logsEl" @scroll="onLogsScroll()"><template x-if="!logs"><span class="log-empty" x-text="logsError ? 'Can\'t read the logs. ' + logsError : 'No output yet.'"></span></template><template x-for="(line, i) in logLines()" :key="i"><span :class="logLineClass(line)" x-text="line + '\n'"></span></template></pre>
                    <p class="help">Shows the last 200 lines. Scroll up or press Esc to pause.</p>
                  </div>
                </template>

                <!-- Site: chat turned off on this server -->
                <template x-if="route.view === 'sites' && currentTab() === 'chat' && !selectedSite.chatEnabled">
                  <div class="note">AI editing is off on this server. Turn it on with <code>siteio agent config set llmOauthToken &lt;token&gt;</code> (from <code>claude setup-token</code>), then restart the agent.</div>
                </template>

                <!-- Site: chat (AI editor) -->
                <template x-if="route.view === 'sites' && currentTab() === 'chat' && selectedSite.chatEnabled">
                  <div class="chat">
                    <div class="row-between small muted chat-head">
                      <span x-show="chatStatus">
                        <span x-text="(chatStatus?.provider || 'AI')"></span><span x-show="chatStatus?.model" x-text="' · ' + chatStatus?.model"></span>
                        <span x-show="chatStatus?.sandbox"> · sandboxed</span>
                      </span>
                      <button type="button" class="btn btn-small" @click="clearChat(route.param)" :disabled="chatStreaming || !(chatMessages && chatMessages.length)">Clear history</button>
                    </div>

                    <div class="chat-log" x-ref="chatScroll" aria-live="polite">
                      <template x-if="chatMessages === null">
                        <p class="muted">⟳ Loading the conversation…</p>
                      </template>

                      <template x-if="chatMessages && chatMessages.length === 0 && !chatStreaming">
                        <div class="stack-s">
                          <h2>Edit this site by chatting</h2>
                          <p class="muted">Describe a change. The AI edits the site's files and publishes them. Changes go live to visitors as soon as they're made, and you can undo each one.</p>
                          <div class="chat-examples">
                            <template x-for="ex in chatExamples" :key="ex">
                              <button type="button" class="btn" @click="chatInput = ex; $refs.chatInputEl && $refs.chatInputEl.focus()" x-text="ex"></button>
                            </template>
                          </div>
                        </div>
                      </template>

                      <template x-for="m in (chatMessages || [])" :key="m.id">
                        <div class="msg" :class="chatBubbleClass(m)">
                          <div class="msg-text" dir="auto" x-text="m.text"></div>
                          <template x-if="m.target">
                            <div class="msg-target break">✎ <span x-text="targetLabel(m.target)"></span></div>
                          </template>
                          <template x-if="m.toolCalls && m.toolCalls.length">
                            <div class="steps">
                              <template x-for="(tc, i) in m.toolCalls" :key="i">
                                <span class="step" x-text="tc.name + (tc.detail ? ' ' + tc.detail : '')"></span>
                              </template>
                            </div>
                          </template>
                          <template x-if="m.role === 'assistant' && m.deployed">
                            <div class="msg-result">
                              <div class="row">
                                <span class="status status-ok">✓ Deployed v<span x-text="m.versionAfter"></span></span>
                                <a :href="selectedSite.url" target="_blank" rel="noreferrer">See it live ↗</a>
                                <button type="button" class="btn btn-small" @click="revertTurn(route.param, m)"
                                        :disabled="pending.has('revert-' + m.id) || m.versionBefore === undefined || m.versionBefore === 0">Undo this change</button>
                              </div>
                              <template x-if="m.changedFiles && m.changedFiles.length">
                                <div class="mono small muted break" x-text="m.changedFiles.length + ' file' + (m.changedFiles.length === 1 ? '' : 's') + ': ' + m.changedFiles.join(', ')"></div>
                              </template>
                            </div>
                          </template>
                          <template x-if="m.role === 'assistant' && m.status === 'no_changes'">
                            <div class="small muted">No change was made, so nothing was published.</div>
                          </template>
                        </div>
                      </template>

                      <template x-if="chatStreaming">
                        <div class="msg msg-ai">
                          <div class="msg-text" x-text="chatLiveText || '…'"></div>
                          <template x-if="chatLiveTools.length">
                            <div class="steps">
                              <template x-for="(tc, i) in chatLiveTools" :key="i">
                                <span class="step" x-text="tc.name + (tc.detail ? ' ' + tc.detail : '')"></span>
                              </template>
                            </div>
                          </template>
                          <div class="small muted"><span class="spin" aria-hidden="true">⟳</span> <span x-text="chatLiveStatus || 'Working…'"></span></div>
                        </div>
                      </template>

                      <template x-if="!chatStreaming && chatStatus && chatStatus.active">
                        <p class="small muted"><span class="spin" aria-hidden="true">⟳</span> A change is being made from another window…</p>
                      </template>
                    </div>

                    <form @submit.prevent="sendChat(route.param)" class="composer">
                      <label for="chatInput" class="sr-only">Describe a change</label>
                      <textarea id="chatInput" x-ref="chatInputEl" x-model="chatInput" rows="2" class="input"
                                @keydown.enter.exact.prevent="sendChat(route.param)"
                                :disabled="chatStreaming || (chatStatus && chatStatus.active)"
                                :placeholder="chatStreaming ? 'Wait for this change to finish…' : 'Describe a change… (Enter to send, Shift+Enter for a new line)'"></textarea>
                      <template x-if="!chatStreaming">
                        <button type="submit" class="btn btn-primary" :disabled="!chatInput.trim()">Send</button>
                      </template>
                      <template x-if="chatStreaming">
                        <button type="button" class="btn btn-danger" @click="stopChat(route.param)">Stop</button>
                      </template>
                    </form>
                  </div>
                </template>
              </div>
            </template>
          </section>
        </template>
      </main>

      <footer class="footer" x-text="agentInfo ? 'siteio ' + agentInfo.version : ''"></footer>
    </div>
  </template>

  <!-- Confirmation dialog, shared by every destructive action -->
  <dialog class="dialog" x-ref="confirmDlg" @close="onConfirmClose()" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title" x-text="confirmState.title"></h2>
      <p class="muted" x-text="confirmState.body"></p>
      <div class="actions">
        <button type="submit" value="cancel" class="btn">Cancel</button>
        <button type="submit" value="ok" class="btn btn-danger" x-text="confirmState.verb"></button>
      </div>
    </form>
  </dialog>

  <div class="toasts" role="status" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div class="toast" x-text="(t.type === 'error' ? '✗ ' : (t.type === 'success' ? '✓ ' : '')) + t.message"></div>
    </template>
  </div>
</body>
</html>
