<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>siteio admin</title>
  <link rel="icon" type="image/svg+xml" href="__ICON_URI__" />

  <style>
/*__STYLES__*/
  </style>
</head>
<body x-data="siteioAdmin()" x-init="init()" @keydown.escape.window="onEscape()">

  <template x-if="!authed">
    <div id="login-view" class="gate">
      <div class="gate-box">
        <div class="stacked">
          <img src="__ICON_URI__" alt="" width="96" height="96" />
          <h1>Sign in to siteio</h1>
        </div>
        <p class="lede muted" x-text="loginMode === 'key' ? 'Enter your server API key.' : 'Enter your username and password.'"></p>
        <form class="card" @submit.prevent="login()">
          <template x-if="loginMode === 'password'">
            <div>
              <label class="form-field">
                <span class="label">Username</span>
                <input id="usernameInput" class="input" type="text" x-model="usernameInput" x-init="$nextTick(() => $el.focus())"
                       autocomplete="username" autocapitalize="none" required />
              </label>
              <label class="form-field">
                <span class="label">Password</span>
                <input id="passwordInput" class="input" type="password" x-model="passwordInput" autocomplete="current-password" required />
              </label>
            </div>
          </template>
          <template x-if="loginMode === 'key'">
            <label class="form-field">
              <span class="label">API key</span>
              <input id="apiKeyInput" class="input mono" type="password" x-model="apiKeyInput" x-init="$nextTick(() => $el.focus())" autocomplete="off" required />
            </label>
          </template>
          <template x-if="loginError">
            <p id="login-error" class="field-error" x-text="loginError"></p>
          </template>
          <button type="submit" :disabled="loginPending" class="button primary wide">
            <span x-show="!loginPending">Sign in</span>
            <span x-show="loginPending">Signing in…</span>
          </button>
        </form>
        <button type="button" @click="loginMode = loginMode === 'key' ? 'password' : 'key'; loginError = ''"
                class="button link switch-mode"
                x-text="loginMode === 'key' ? 'Use username and password' : 'Use API key'"></button>
      </div>
    </div>
  </template>

  <template x-if="authed">
    <div class="shell">
      <aside class="sidebar">
        <div class="lockup"><img src="__ICON_URI__" alt="" width="26" height="26" />siteio</div>
        <nav class="tabs" aria-label="Main">
          <a href="#/services" :class="navClass('services')">
            <i class="hgi hgi-stroke hgi-dashboard-square-01"></i> Services
            <span class="count" x-show="services" x-text="services ? services.length : ''"></span>
          </a>
          <a href="#/settings" :class="navClass('settings')">
            <i class="hgi hgi-stroke hgi-settings-02"></i> Settings
          </a>
          <template x-if="canManageUsers()">
            <a href="#/users" :class="navClass('users')">
              <i class="hgi hgi-stroke hgi-user-group"></i> Users
            </a>
          </template>
          <template x-if="me && me.username">
            <a href="#/account" :class="navClass('account')">
              <i class="hgi hgi-stroke hgi-user-circle"></i> Account
            </a>
          </template>
        </nav>
        <div class="where">
          <span class="host mono" x-text="hostname"></span>
          <template x-if="me && me.username">
            <a href="#/account" class="me">
              <span class="avatar" x-text="me.username.charAt(0)"></span>
              <span class="grow">
                <span class="name" x-text="me.username"></span>
                <span><span x-text="me.role"></span><span x-show="me.tenant" x-text="' · ' + me.tenant"></span></span>
              </span>
            </a>
          </template>
          <template x-if="me && !me.username">
            <div class="me">
              <span class="grow">
                <span class="name" x-text="me.role === 'owner' ? 'Signed in with the tenant key' : 'Signed in with the server key'"></span>
                <span>Sign in as a user to manage your password</span>
              </span>
            </div>
          </template>
          <button @click="logout()" class="button link sign-out">
            <i class="hgi hgi-stroke hgi-logout-03"></i> Logout
          </button>
        </div>
      </aside>

      <main id="main" tabindex="-1">
          <!-- Services grid (unified sites + apps) -->
          <template x-if="route.view === 'services'">
            <section>
              <div class="pane-head">
                <div class="title"><h1>Services</h1></div>
                <div class="tools">
                  <button @click="loadServices()" :disabled="pending.has('services-list')" class="button">
                    <i class="hgi hgi-stroke hgi-refresh" :class="pending.has('services-list') ? 'spinning' : ''"></i>
                    <span x-show="!pending.has('services-list')">Refresh</span>
                    <span x-show="pending.has('services-list')">Loading…</span>
                  </button>
                </div>
              </div>

              <!-- Filter tabs -->
              <div class="bar">
                <div class="seg" aria-label="Filter">
                  <template x-for="f in [{k:'all',label:'All'},{k:'sites',label:'Sites'},{k:'apps',label:'Apps'}]" :key="f.k">
                    <button @click="serviceFilter = f.k" :class="serviceFilter === f.k ? 'on' : ''" :aria-pressed="serviceFilter === f.k">
                      <span x-text="f.label"></span>
                      <span class="n" x-text="serviceCount(f.k)"></span>
                    </button>
                  </template>
                </div>
              </div>

              <template x-if="services === null">
                <div class="loading">Loading services…</div>
              </template>

              <template x-if="services && filteredServices().length === 0">
                <div class="empty-state">
                  Nothing here yet. Deploy a site with <code>siteio sites deploy</code>
                  or create an app with <code>siteio apps create</code>.
                </div>
              </template>

              <template x-if="services && filteredServices().length > 0">
                <div class="svc-grid">
                  <template x-for="item in filteredServices()" :key="item.kind + ':' + item.name">
                    <a :href="serviceHref(item)" :data-service-name="item.name" class="svc-card">
                      <!-- Card preview: generated thumbnail when available, else a placeholder -->
                      <div class="preview">
                        <template x-if="thumbs[item.kind + ':' + item.name]">
                          <img :src="thumbs[item.kind + ':' + item.name]" alt="" />
                        </template>
                        <template x-if="!thumbs[item.kind + ':' + item.name]">
                          <div class="preview-none">
                            <i :class="item.kind === 'site' ? 'hgi-stroke hgi-globe' : 'hgi-stroke hgi-package'" class="hgi"></i>
                            <div class="none">No preview</div>
                          </div>
                        </template>
                        <!-- Regenerate the preview without following the card link -->
                        <button @click.stop.prevent="refreshThumbnail(item)"
                                :disabled="pending.has('thumb:' + item.kind + ':' + item.name)"
                                :title="'Refresh preview'" class="over left">
                          <i class="hgi hgi-stroke hgi-refresh"
                             :class="pending.has('thumb:' + item.kind + ':' + item.name) ? 'spinning' : ''"></i>
                        </button>
                        <!-- Open the live URL in a new tab without triggering the card's link to detail -->
                        <button @click.stop.prevent="window.open(item.url, '_blank', 'noopener')"
                                :title="'Open ' + servicePrimaryDomain(item)" class="over right">
                          <i class="hgi hgi-stroke hgi-link-square-02"></i>
                        </button>
                      </div>
                      <!-- Body -->
                      <div class="body">
                        <div class="row">
                          <span :class="'chip ' + item.kind" x-text="item.kind"></span>
                          <span :class="statusBadgeClass(item.status)" x-text="item.status"></span>
                        </div>
                        <span class="domain" x-text="servicePrimaryDomain(item)" :title="servicePrimaryDomain(item)"></span>
                        <span class="name" x-text="item.name"></span>
                        <div class="meta">
                          <div class="row">
                            <span x-text="serviceMeta(item)"></span>
                            <span class="tls" x-text="item.tls ? ('tls: ' + item.tls) : ''"></span>
                          </div>
                          <template x-if="serviceUpdated(item)">
                            <div class="row updated" :title="formatAbsoluteTime(item.deployedAt)">
                              <span class="updated"><i class="hgi hgi-stroke hgi-clock-01"></i><span x-text="serviceUpdated(item)"></span></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </a>
                  </template>
                </div>
              </template>
            </section>
          </template>

          <!-- Account: own password and devices -->
          <template x-if="route.view === 'account'">
            <section>
              <div class="pane-head">
                <div class="title">
                  <h1>Account</h1>
                  <template x-if="me && me.username">
                    <span class="muted"><span x-text="me.username"></span> <span class="chip" x-text="me.role"></span></span>
                  </template>
                </div>
              </div>
              <div class="readable">
                <h2>Change password</h2>
                <form @submit.prevent="changePassword()" class="card pad section">
                  <label class="form-field">
                    <span class="label">Current password</span>
                    <input id="pwCurrent" class="input" type="password" x-model="pwCurrent" autocomplete="current-password" required />
                  </label>
                  <label class="form-field">
                    <span class="label">New password</span>
                    <input id="pwNew" class="input" type="password" x-model="pwNew" autocomplete="new-password" minlength="8" required />
                    <span class="help">8 characters or more.</span>
                  </label>
                  <label class="form-field">
                    <span class="label">Confirm new password</span>
                    <input id="pwConfirm" class="input" type="password" x-model="pwConfirm" autocomplete="new-password" minlength="8" required />
                  </label>
                  <template x-if="pwError"><p class="field-error" x-text="pwError"></p></template>
                  <button type="submit" :disabled="pwPending" class="button primary">Change password</button>
                </form>

                <h2>Signed-in devices</h2>
                <template x-if="myKeys === null"><p class="loading">Loading…</p></template>
                <template x-if="myKeys && myKeys.length === 0"><p class="empty-state">No signed-in devices.</p></template>
                <template x-if="myKeys && myKeys.length > 0">
                  <div class="table-box">
                    <table class="grid">
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Type</th>
                          <th>Created</th>
                          <th>Expires</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="k in myKeys" :key="k.id">
                          <tr>
                            <td>
                              <b x-text="k.name"></b>
                              <span class="chip accent" x-show="me && k.id === me.currentKeyId">This browser</span>
                            </td>
                            <td class="muted" x-text="keyKindLabel(k)"></td>
                            <td class="muted" x-text="shortDate(k.createdAt)"></td>
                            <td class="muted" x-text="k.kind === 'session' ? shortDate(k.expiresAt) : ''"></td>
                            <td class="end">
                              <button @click="revokeMyKey(k.id)" x-show="!me || k.id !== me.currentKeyId" class="button small danger">Revoke</button>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </section>
          </template>

          <!-- Users (admin and tenant owners) -->
          <template x-if="route.view === 'users'">
            <section>
              <div class="pane-head">
                <div class="title"><h1>Users</h1></div>
                <div class="tools">
                  <template x-if="!usersForbidden">
                    <button @click="toggleAddUser()" class="button primary">
                      <i class="hgi hgi-stroke hgi-add-01"></i> Add user
                    </button>
                  </template>
                </div>
              </div>
              <div class="readable">
                <p class="lede">People who can sign in to this server's admin UI and CLI.</p>

                <template x-if="showAddUser && !usersForbidden">
                  <div class="section">
                    <h2>Add user</h2>
                    <form @submit.prevent="addUser()" class="card pad">
                      <label class="form-field">
                        <span class="label">Username</span>
                        <input id="newUsername" class="input" x-model="newUser.username" required autocomplete="off" data-1p-ignore data-lpignore="true" autocapitalize="none" />
                        <span class="help">lowercase letters, numbers and hyphens</span>
                      </label>
                      <label class="form-field">
                        <span class="label">Role</span>
                        <select id="newRole" class="input" x-model="newUser.role" @change="onNewUserRoleChange()" :disabled="!isAdmin()">
                          <option value="member">member</option>
                          <template x-if="isAdmin()"><option value="owner">owner</option></template>
                          <template x-if="isAdmin()"><option value="admin">admin</option></template>
                        </select>
                      </label>
                      <template x-if="isAdmin()">
                        <label class="form-field">
                          <span class="label">Scope</span>
                          <select id="newScope" class="input" x-model="newUser.tenant" :disabled="newUser.role === 'admin'">
                            <option value="" :disabled="newUser.role === 'owner'" x-text="'Main domain (' + (agentInfo ? agentInfo.domain : '…') + ')'"></option>
                            <template x-for="t in tenantList()" :key="t">
                              <option :value="t" x-text="t"></option>
                            </template>
                          </select>
                        </label>
                      </template>
                      <fieldset class="plain">
                        <legend class="label">Password</legend>
                        <label class="check">
                          <input type="radio" value="generate" x-model="newUser.passwordMode" /> Generate a password
                        </label>
                        <label class="check">
                          <input type="radio" value="set" x-model="newUser.passwordMode" /> Set a password
                        </label>
                        <template x-if="newUser.passwordMode === 'set'">
                          <input type="password" class="input" x-model="newUser.password" autocomplete="new-password" minlength="8" aria-label="Password" placeholder="At least 8 characters" />
                        </template>
                      </fieldset>
                      <template x-if="ownerWithoutTenant()"><p class="field-error">Add a tenant first (siteio agent tenant add &lt;domain&gt;)</p></template>
                      <template x-if="addUserError"><p class="field-error" x-text="addUserError"></p></template>
                      <div class="actions">
                        <button type="submit" :disabled="addUserPending || ownerWithoutTenant()" class="button primary">Create user</button>
                        <button type="button" @click="showAddUser = false" class="button">Cancel</button>
                      </div>
                    </form>
                  </div>
                </template>

                <template x-if="users === null"><p class="loading">Loading…</p></template>
                <template x-if="usersForbidden"><p class="empty-state">You don't have access to user management.</p></template>
                <template x-if="users && users.length === 0 && !usersForbidden"><p class="empty-state">No users yet.</p></template>
                <template x-if="users && users.length > 0">
                  <div class="table-box">
                    <table class="grid">
                      <thead>
                        <tr>
                          <th>Username</th>
                          <th>Role</th>
                          <th>Scope</th>
                          <th>Created</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="u in users" :key="u.username">
                          <tr class="top">
                            <td>
                              <b x-text="u.username"></b>
                              <span class="muted" x-show="me && u.username === me.username">(you)</span>
                            </td>
                            <td><span class="chip" x-text="u.role"></span></td>
                            <td class="muted" x-text="u.tenant || 'Main domain'"></td>
                            <td class="muted" x-text="shortDate(u.createdAt)"></td>
                            <td class="end">
                              <template x-if="me && u.username === me.username">
                                <a href="#/account" class="small">Change on Account page</a>
                              </template>
                              <template x-if="!me || u.username !== me.username">
                                <div>
                                  <div class="right">
                                    <button @click="openReset(u.username)" class="button small">Set password</button>
                                    <button x-show="u.username !== 'admin'" @click="deleteUser(u.username)" class="button small danger">Remove</button>
                                  </div>
                                  <template x-if="resetFor === u.username">
                                    <form @submit.prevent="resetUserPassword(u.username)" class="inline-form">
                                      <label class="check">
                                        <input type="radio" value="generate" x-model="reset.mode" /> Generate a password
                                      </label>
                                      <label class="check">
                                        <input type="radio" value="set" x-model="reset.mode" /> Set a password
                                      </label>
                                      <template x-if="reset.mode === 'set'">
                                        <input type="password" class="input" x-model="reset.password" autocomplete="new-password" minlength="8" aria-label="New password" placeholder="At least 8 characters" />
                                      </template>
                                      <template x-if="reset.error"><p class="field-error" x-text="reset.error"></p></template>
                                      <div class="actions">
                                        <button type="submit" :disabled="reset.pending" class="button small primary">Save</button>
                                        <button type="button" @click="resetFor = null" class="button small">Cancel</button>
                                      </div>
                                    </form>
                                  </template>
                                </div>
                              </template>
                            </td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </template>
              </div>
            </section>
          </template>

          <!-- Settings (read-only agent info) -->
          <template x-if="route.view === 'settings'">
            <section>
              <div class="pane-head">
                <div class="title"><h1>Agent settings</h1></div>
                <div class="tools">
                  <button @click="loadAgentInfo()" :disabled="pending.has('agent-info')" class="button">
                    <i class="hgi hgi-stroke hgi-refresh"></i> Refresh
                  </button>
                </div>
              </div>

              <template x-if="agentInfo === null">
                <div class="loading">Loading settings…</div>
              </template>

              <template x-if="agentInfo">
                <div class="readable">
                  <h2>Server</h2>
                  <ul class="kv">
                    <li><span class="label">Domain</span><span class="value mono" x-text="agentInfo.domain"></span></li>
                    <li><span class="label">Agent version</span><span class="value mono" x-text="agentInfo.version"></span></li>
                    <li><span class="label">Let's Encrypt email</span><span class="value mono" x-text="agentInfo.email || '—'"></span></li>
                  </ul>
                  <h2>Hosting</h2>
                  <ul class="kv">
                    <li><span class="label">Sites</span><span class="value mono" x-text="agentInfo.siteCount"></span></li>
                    <li><span class="label">Apps</span><span class="value mono" x-text="agentInfo.appCount"></span></li>
                    <li><span class="label">Apps surface</span><span class="value mono" x-text="agentInfo.appsEnabled ? 'enabled' : 'disabled'"></span></li>
                  </ul>
                  <h2>Runtime</h2>
                  <ul class="kv">
                    <li><span class="label">Data dir</span><span class="value mono" x-text="agentInfo.dataDir"></span></li>
                    <li><span class="label">HTTP / HTTPS</span><span class="value mono" x-text="agentInfo.httpPort + ' / ' + agentInfo.httpsPort"></span></li>
                    <li><span class="label">Max upload</span><span class="value mono" x-text="formatBytes(agentInfo.maxUploadSize)"></span></li>
                  </ul>
                </div>
              </template>
            </section>
          </template>

          <!-- App detail -->
          <template x-if="route.view === 'apps' && route.param">
            <section>
              <div class="pane-head">
                <div class="title">
                  <a href="#/services" class="back"><i class="hgi hgi-stroke hgi-arrow-left-01"></i>Services</a>
                  <h1 x-text="route.param"></h1>
                  <template x-if="selectedApp && selectedApp !== 'not-found'">
                    <span :class="statusBadgeClass(selectedApp.status)" x-text="selectedApp.status"></span>
                  </template>
                </div>
                <div class="tools" x-show="selectedApp && selectedApp !== 'not-found'">
                  <a :href="selectedApp?.url" target="_blank" rel="noreferrer" class="button">
                    <i class="hgi hgi-stroke hgi-link-square-02"></i> Open ↗
                  </a>
                  <button :disabled="anyAppActionPending()" @click="deployApp(route.param)" class="button primary">
                    <i class="hgi hgi-stroke hgi-rocket"></i>
                    <span x-show="!pending.has('deploy')">Deploy</span>
                    <span x-show="pending.has('deploy')">Deploying…</span>
                  </button>
                  <template x-if="selectedApp?.status !== 'stopped'">
                    <button :disabled="anyAppActionPending()" @click="stopApp(route.param)" class="button">
                      <i class="hgi hgi-stroke hgi-stop-circle"></i> Stop
                    </button>
                  </template>
                  <template x-if="selectedApp?.status !== 'stopped'">
                    <button :disabled="anyAppActionPending()" @click="restartApp(route.param)" class="button">
                      <i class="hgi hgi-stroke hgi-reload"></i> Restart
                    </button>
                  </template>
                  <template x-if="selectedApp?.status === 'stopped'">
                    <button :disabled="anyAppActionPending()" @click="startApp(route.param)" class="button">
                      <i class="hgi hgi-stroke hgi-reload"></i> Start
                    </button>
                  </template>
                  <button :disabled="anyAppActionPending()" @click="removeApp(route.param)" class="button danger">
                    <i class="hgi hgi-stroke hgi-delete-02"></i> Remove
                  </button>
                </div>
              </div>

              <template x-if="selectedApp === null">
                <div class="loading">Loading…</div>
              </template>

              <template x-if="selectedApp === 'not-found'">
                <div class="empty-state">
                  App not found — it may have been removed.
                  <a href="#/services">Back to services</a>.
                </div>
              </template>

              <template x-if="selectedApp && selectedApp !== 'not-found'">
                <div>
                  <!-- Sub-tabs -->
                  <div class="bar">
                    <div class="seg">
                      <button @click="window.location.hash = '#/apps/' + route.param + '/overview'"
                              :class="(route.subtab === 'overview' || !route.subtab) ? 'on' : ''">
                        Overview
                      </button>
                      <button @click="window.location.hash = '#/apps/' + route.param + '/logs'"
                              :class="route.subtab === 'logs' ? 'on' : ''">
                        Logs
                      </button>
                    </div>
                  </div>

                  <!-- Overview pane -->
                  <template x-if="!route.subtab || route.subtab === 'overview'">
                    <div class="grid-2">
                      <div>
                        <h2>Source</h2>
                        <ul class="kv">
                          <template x-if="selectedApp.compose">
                            <li><span class="label">Compose</span>
                              <span class="value mono">
                                <span x-text="selectedApp.compose.source"></span> · primary: <span x-text="selectedApp.compose.primaryService"></span>
                                <template x-if="selectedApp.compose.path"><span class="block muted" x-text="'path: ' + selectedApp.compose.path"></span></template>
                              </span>
                            </li>
                          </template>
                          <template x-if="selectedApp.git && !selectedApp.compose">
                            <li><span class="label">Git</span>
                              <span class="value mono">
                                <span class="block" x-text="selectedApp.git.repoUrl"></span>
                                <span class="block muted" x-text="'branch: ' + selectedApp.git.branch + ' · dockerfile: ' + selectedApp.git.dockerfile"></span>
                                <template x-if="selectedApp.git.context"><span class="block muted" x-text="'context: ' + selectedApp.git.context"></span></template>
                                <template x-if="selectedApp.git.tokenSet"><span class="block muted">token: *** (stored)</span></template>
                              </span>
                            </li>
                          </template>
                          <template x-if="selectedApp.dockerfile && !selectedApp.git">
                            <li><span class="label">Dockerfile</span><span class="value mono">inline dockerfile</span></li>
                          </template>
                          <template x-if="!selectedApp.compose && !selectedApp.git && !selectedApp.dockerfile">
                            <li><span class="label">Image</span><span class="value mono" x-text="selectedApp.image"></span></li>
                          </template>
                        </ul>
                      </div>

                      <div>
                        <h2>Routing</h2>
                        <ul class="kv">
                          <li><span class="label">Internal port</span><span class="value mono" x-text="selectedApp.internalPort"></span></li>
                          <li><span class="label">Domains</span>
                            <span class="value links mono">
                              <template x-if="(selectedApp.domains || []).length === 0"><span>—</span></template>
                              <template x-for="d in (selectedApp.domains || [])" :key="d">
                                <a :href="'https://' + d" target="_blank" rel="noreferrer" x-text="d"></a>
                              </template>
                            </span>
                          </li>
                          <li><span class="label">Restart policy</span><span class="value mono" x-text="selectedApp.restartPolicy || 'unless-stopped'"></span></li>
                        </ul>
                      </div>

                      <div class="span">
                        <h2>Environment</h2>
                        <template x-if="Object.keys(selectedApp.env || {}).length === 0">
                          <ul class="kv"><li><span class="empty">No env vars set.</span></li></ul>
                        </template>
                        <template x-if="Object.keys(selectedApp.env || {}).length > 0">
                          <ul class="kv env">
                            <template x-for="k in Object.keys(selectedApp.env).sort()" :key="k">
                              <li>
                                <span class="label" x-text="k"></span>
                                <span class="value mono" x-text="selectedApp.env[k]"></span>
                              </li>
                            </template>
                          </ul>
                        </template>
                      </div>

                      <div class="span">
                        <h2>Volumes</h2>
                        <template x-if="(selectedApp.volumes || []).length === 0">
                          <ul class="kv"><li><span class="empty">No volumes.</span></li></ul>
                        </template>
                        <template x-if="(selectedApp.volumes || []).length > 0">
                          <ul class="kv">
                            <template x-for="v in selectedApp.volumes" :key="v.name + ':' + v.mountPath">
                              <li class="mono" x-text="v.name + ' → ' + v.mountPath + (v.readonly ? ' (ro)' : '')"></li>
                            </template>
                          </ul>
                        </template>
                      </div>

                      <div class="span">
                        <h2>Build / deploy state</h2>
                        <ul class="kv">
                          <li><span class="label">Created</span><span class="value mono" x-text="selectedApp.createdAt || '—'"></span></li>
                          <li><span class="label">Deployed</span><span class="value mono" x-text="selectedApp.deployedAt || '—'"></span></li>
                          <template x-if="selectedApp.commitHash"><li><span class="label">Commit</span><span class="value mono" x-text="selectedApp.commitHash"></span></li></template>
                          <template x-if="selectedApp.lastBuildAt"><li><span class="label">Last build</span><span class="value mono" x-text="selectedApp.lastBuildAt"></span></li></template>
                          <template x-if="selectedApp.containerId"><li><span class="label">Container</span><span class="value mono" x-text="selectedApp.containerId.substring(0, 12)"></span></li></template>
                        </ul>
                      </div>
                    </div>
                  </template>

                  <template x-if="route.subtab === 'logs'">
                    <div>
                      <div class="bar">
                        <label class="check">
                          <input type="checkbox" x-model="logsAuto" @change="logsAuto ? startLogsPoll() : stopLogsPoll()">
                          Auto-refresh (3s)
                        </label>
                        <div class="tools">
                          <button @click="loadLogs(route.param)" :disabled="pending.has('logs')" class="button">
                            <i class="hgi hgi-stroke hgi-refresh"></i> Refresh now
                          </button>
                        </div>
                      </div>
                      <pre class="logs" x-ref="logsEl" x-text="logs || 'No logs yet.'"></pre>
                    </div>
                  </template>

                </div>
              </template>
            </section>
          </template>

          <!-- Site detail -->
          <template x-if="route.view === 'sites' && route.param">
            <section>
              <div class="pane-head">
                <div class="title">
                  <a href="#/services" class="back"><i class="hgi hgi-stroke hgi-arrow-left-01"></i>Services</a>
                  <h1 x-text="route.param"></h1>
                  <template x-if="selectedSite && selectedSite !== 'not-found'">
                    <span :class="statusBadgeClass(selectedSite.status)" x-text="selectedSite.status"></span>
                  </template>
                </div>
                <div class="tools" x-show="selectedSite && selectedSite !== 'not-found'">
                  <a :href="selectedSite?.url" target="_blank" rel="noreferrer" class="button">
                    <i class="hgi hgi-stroke hgi-link-square-02"></i> Open ↗
                  </a>
                  <template x-if="selectedSite?.status !== 'stopped'">
                    <button :disabled="pending.has('site-stop')" @click="stopSite(route.param)" class="button">
                      <i class="hgi hgi-stroke hgi-stop-circle"></i> Stop
                    </button>
                  </template>
                  <template x-if="selectedSite?.status === 'stopped'">
                    <button :disabled="pending.has('site-start')" @click="startSite(route.param)" class="button">
                      <i class="hgi hgi-stroke hgi-reload"></i> Start
                    </button>
                  </template>
                  <button :disabled="pending.has('undeploy')" @click="undeploySite(route.param)" class="button danger">
                    <i class="hgi hgi-stroke hgi-delete-02"></i> Remove
                  </button>
                </div>
              </div>

              <template x-if="selectedSite === null"><div class="loading">Loading…</div></template>
              <template x-if="selectedSite === 'not-found'">
                <div class="empty-state">
                  Site not found.
                  <a href="#/services">Back to services</a>.
                </div>
              </template>

              <template x-if="selectedSite && selectedSite !== 'not-found'">
                <div>
                  <div class="bar">
                    <div class="seg">
                      <button @click="window.location.hash = '#/sites/' + route.param + '/overview'"
                              :class="(route.subtab === 'overview' || !route.subtab) ? 'on' : ''">Overview</button>
                      <button @click="window.location.hash = '#/sites/' + route.param + '/history'"
                              :class="route.subtab === 'history' ? 'on' : ''">History</button>
                      <button @click="window.location.hash = '#/sites/' + route.param + '/logs'"
                              :class="route.subtab === 'logs' ? 'on' : ''">Logs</button>
                      <template x-if="selectedSite.chatEnabled">
                        <button @click="window.location.hash = '#/sites/' + route.param + '/chat'"
                                :class="route.subtab === 'chat' ? 'on' : ''">
                          <i class="hgi hgi-stroke hgi-ai-chat-02"></i> Chat
                        </button>
                      </template>
                    </div>
                  </div>

                  <template x-if="!route.subtab || route.subtab === 'overview'">
                    <div class="grid-2">
                      <template x-if="selectedSite.chatEnabled">
                        <div class="banner span">
                          <div class="grow">
                            <b>Live editor</b>
                            <span>Edit this site by chatting on the site itself — changes go live immediately.</span>
                          </div>
                          <button @click="openLiveEditor(route.param)" :disabled="pending.has('editlink-' + route.param)" class="button primary">
                            <i class="hgi hgi-stroke hgi-pencil-edit-02"></i> Open live editor
                          </button>
                        </div>
                      </template>
                      <div>
                        <h2>URL</h2>
                        <ul class="kv">
                          <li><a :href="selectedSite.url" target="_blank" rel="noreferrer" class="mono" x-text="selectedSite.url"></a></li>
                        </ul>
                      </div>
                      <div>
                        <h2>Deployed</h2>
                        <ul class="kv">
                          <li><span class="label">Deployed</span><span class="value mono" x-text="selectedSite.deployedAt"></span></li>
                          <li><span class="label">Version</span><span class="value mono" x-text="selectedSite.version || '—'"></span></li>
                          <li><span class="label">Size</span><span class="value mono" x-text="formatBytes(selectedSite.size)"></span></li>
                          <li><span class="label">TLS</span><span class="value mono" x-text="selectedSite.tls || '—'"></span></li>
                        </ul>
                      </div>
                      <div class="span">
                        <h2>Custom domains</h2>
                        <ul class="kv">
                          <li>
                            <template x-if="(selectedSite.domains || []).length === 0"><span class="mono">—</span></template>
                            <span class="value links start mono">
                              <template x-for="d in (selectedSite.domains || [])" :key="d">
                                <a :href="'https://' + d" target="_blank" rel="noreferrer" x-text="d"></a>
                              </template>
                            </span>
                          </li>
                        </ul>
                      </div>
                      <div class="span">
                        <h2>Backend</h2>
                        <ul class="kv">
                          <li><span class="label">Status</span><span class="value mono" x-text="selectedSite.status"></span></li>
                          <li><span class="label">PocketBase</span><span class="value mono" x-text="selectedSite.pocketbaseVersion"></span></li>
                          <li><span class="label">Admin</span><span class="value"><a :href="selectedSite.adminUrl" target="_blank" rel="noreferrer" class="mono" x-text="selectedSite.adminUrl"></a></span></li>
                        </ul>
                      </div>
                    </div>
                  </template>

                  <template x-if="route.subtab === 'history'">
                    <div>
                      <template x-if="siteHistory === null"><div class="loading">Loading history…</div></template>
                      <template x-if="siteHistory && siteHistory.length === 0"><div class="empty-state">No history.</div></template>
                      <template x-if="siteHistory && siteHistory.length > 0">
                        <div class="table-box">
                          <table class="grid">
                            <thead>
                              <tr>
                                <th>Version</th>
                                <th>Deployed</th>
                                <th>By</th>
                                <th>Size</th>
                                <th></th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="v in siteHistory" :key="v.version">
                                <tr :data-version="v.version">
                                  <td class="mono" x-text="v.version"></td>
                                  <td class="mono muted" x-text="v.deployedAt"></td>
                                  <td class="muted" x-text="v.deployedBy || '—'"></td>
                                  <td class="muted" x-text="formatBytes(v.size)"></td>
                                  <td class="end">
                                    <button
                                      :disabled="pending.has('rollback-' + v.version) || v.version === selectedSite.version"
                                      @click="rollbackSite(route.param, v.version)"
                                      class="button small">
                                      <template x-if="v.version === selectedSite.version"><span>current</span></template>
                                      <template x-if="v.version !== selectedSite.version"><span>Rollback</span></template>
                                    </button>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="route.subtab === 'logs'">
                    <div>
                      <div class="bar">
                        <label class="check">
                          <input type="checkbox" x-model="logsAuto" @change="logsAuto ? startLogsPoll() : stopLogsPoll()">
                          Auto-refresh (3s)
                        </label>
                        <div class="tools">
                          <button @click="loadLogs(route.param)" :disabled="pending.has('logs')" class="button">
                            <i class="hgi hgi-stroke hgi-refresh"></i> Refresh now
                          </button>
                        </div>
                      </div>
                      <pre class="logs" x-ref="logsEl" x-text="logs || 'No logs yet.'"></pre>
                    </div>
                  </template>

                  <!-- Chat (AI editor) -->
                  <template x-if="route.subtab === 'chat' && !selectedSite.chatEnabled">
                    <div class="card pad muted">
                      Chat is not configured on this agent. Set a Claude subscription token
                      (<code>SITEIO_LLM_OAUTH_TOKEN</code>) or
                      <code>SITEIO_LLM_API_KEY</code> and restart the agent to enable it.
                    </div>
                  </template>

                  <template x-if="route.subtab === 'chat' && selectedSite.chatEnabled">
                    <div class="chat">
                      <!-- Header -->
                      <div class="chat-head">
                        <div>
                          <span x-show="chatStatus">
                            <span x-text="(chatStatus?.provider || 'ai')"></span><span x-show="chatStatus?.model" x-text="' · ' + chatStatus?.model"></span>
                            <span x-show="chatStatus?.sandbox" class="sandboxed"><i class="hgi hgi-stroke hgi-shield-01"></i>sandboxed</span>
                          </span>
                        </div>
                        <button @click="clearChat(route.param)"
                                :disabled="chatStreaming || !(chatMessages && chatMessages.length)"
                                class="button small">
                          <i class="hgi hgi-stroke hgi-delete-02"></i> Clear
                        </button>
                      </div>

                      <!-- Transcript -->
                      <div class="transcript" x-ref="chatScroll">
                        <template x-if="chatMessages === null">
                          <div class="loading">Loading conversation…</div>
                        </template>

                        <!-- Empty state -->
                        <template x-if="chatMessages && chatMessages.length === 0 && !chatStreaming">
                          <div class="intro">
                            <b>Edit this site by chatting</b>
                            <div>Describe a change and the AI will edit the site's files and
                              <b class="inline">deploy it live immediately</b>. Every change can be reverted from its message.</div>
                            <div class="examples">
                              <template x-for="ex in chatExamples" :key="ex">
                                <button @click="chatInput = ex; $refs.chatInputEl && $refs.chatInputEl.focus()" x-text="ex"></button>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- Messages -->
                        <template x-for="m in (chatMessages || [])" :key="m.id">
                          <div :class="m.role === 'user' ? 'msg-row user' : 'msg-row'">
                            <div :class="chatBubbleClass(m)">
                              <div class="text" x-text="m.text"></div>

                              <!-- picked element/text this message was anchored to -->
                              <template x-if="m.target">
                                <div class="target">
                                  ✎ <span x-text="targetLabel(m.target)"></span>
                                </div>
                              </template>

                              <!-- tool call chips -->
                              <template x-if="m.toolCalls && m.toolCalls.length">
                                <div class="tool-chips">
                                  <template x-for="(tc, i) in m.toolCalls" :key="i">
                                    <span class="tool-chip">
                                      <span x-text="tc.name"></span><span x-show="tc.detail" class="detail" x-text="tc.detail"></span>
                                    </span>
                                  </template>
                                </div>
                              </template>

                              <!-- changed files + deploy + revert -->
                              <template x-if="m.role === 'assistant' && m.deployed">
                                <div class="msg-foot">
                                  <div class="row">
                                    <span class="deployed"><i class="hgi hgi-stroke hgi-checkmark-circle-02"></i><span>Deployed v<span x-text="m.versionAfter"></span></span></span>
                                    <a :href="selectedSite.url" target="_blank" rel="noreferrer"><i class="hgi hgi-stroke hgi-link-square-02"></i>View live</a>
                                    <button @click="revertTurn(route.param, m)"
                                            :disabled="pending.has('revert-' + m.id) || m.versionBefore === undefined || m.versionBefore === 0"
                                            class="button small push">
                                      <i class="hgi hgi-stroke hgi-arrow-turn-backward"></i> Revert this change
                                    </button>
                                  </div>
                                  <template x-if="m.changedFiles && m.changedFiles.length">
                                    <div class="files" x-text="m.changedFiles.length + ' file' + (m.changedFiles.length===1?'':'s') + ': ' + m.changedFiles.join(', ')"></div>
                                  </template>
                                </div>
                              </template>

                              <template x-if="m.role === 'assistant' && m.status === 'no_changes'">
                                <div class="note">No changes — nothing deployed.</div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- Live in-progress turn -->
                        <template x-if="chatStreaming">
                          <div class="msg-row">
                            <div class="msg">
                              <div class="text" x-text="chatLiveText || '…'"></div>
                              <template x-if="chatLiveTools.length">
                                <div class="tool-chips">
                                  <template x-for="(tc, i) in chatLiveTools" :key="i">
                                    <span class="tool-chip">
                                      <span x-text="tc.name"></span><span x-show="tc.detail" class="detail" x-text="tc.detail"></span>
                                    </span>
                                  </template>
                                </div>
                              </template>
                              <template x-if="chatLiveStatus">
                                <div class="live-status"><i class="hgi hgi-stroke hgi-loading-03 spinning"></i><span x-text="chatLiveStatus"></span></div>
                              </template>
                            </div>
                          </div>
                        </template>

                        <!-- Another client's turn is running -->
                        <template x-if="!chatStreaming && chatStatus && chatStatus.active">
                          <div class="running"><i class="hgi hgi-stroke hgi-loading-03 spinning"></i> A turn is running…</div>
                        </template>
                      </div>

                      <!-- Composer -->
                      <form @submit.prevent="sendChat(route.param)" class="composer">
                        <textarea x-ref="chatInputEl" x-model="chatInput" rows="2"
                                  @keydown.enter.exact.prevent="sendChat(route.param)"
                                  :disabled="chatStreaming"
                                  placeholder="Describe a change… (Enter to send, Shift+Enter for newline)"
                                  class="input"></textarea>
                        <template x-if="!chatStreaming">
                          <button type="submit" :disabled="!chatInput.trim()" class="button primary">
                            <i class="hgi hgi-stroke hgi-sent"></i> Send
                          </button>
                        </template>
                        <template x-if="chatStreaming">
                          <button type="button" @click="stopChat(route.param)" class="button danger">
                            <i class="hgi hgi-stroke hgi-stop-circle"></i> Stop
                          </button>
                        </template>
                      </form>
                    </div>
                  </template>
                </div>
              </template>
            </section>
          </template>
      </main>

      <template x-if="shownPassword">
        <div class="overlay" role="dialog" aria-modal="true">
          <div class="dialog">
            <h2>Password for <span x-text="shownPassword.username"></span></h2>
            <div class="secret">
              <code x-text="shownPassword.password"></code>
              <button @click="copyPassword()" class="button">Copy</button>
            </div>
            <p class="help">Shown only once — share it securely. They can change it on their Account page.</p>
            <div class="actions">
              <button @click="shownPassword = null" class="button primary">Done</button>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <div id="toasts" aria-live="polite">
    <template x-for="t in toasts" :key="t.id">
      <div :class="t.type === 'error' ? 'toast error' : (t.type === 'success' ? 'toast success' : 'toast')">
        <span x-text="t.message"></span>
      </div>
    </template>
  </div>
  <!-- The chat transport, the admin's component, then Alpine, which starts on them. -->
  <script>
//__CHAT_CORE__
  </script>
  <script>
//__UI_JS__
  </script>
  <script>
//__ALPINE__
  </script>
</body>
</html>
