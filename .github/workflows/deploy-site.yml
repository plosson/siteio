name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to siteio.houlahop.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary
        run: bun build src/cli.ts --compile --minify --outfile siteio

      - name: Login
        run: ./siteio login --username github-actions
        env:
          SITEIO_TOKEN: ${{ secrets.SITEIO_TOKEN }}

      - name: Deploy site
        run: ./siteio sites deploy site -n siteio
