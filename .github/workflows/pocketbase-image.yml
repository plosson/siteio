name: PocketBase Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docker/pocketbase/**'
      - 'src/lib/pocketbase-version.ts'
      - '.github/workflows/pocketbase-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push siteio-pocketbase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract pinned PocketBase version
        id: ver
        run: |
          V=$(grep -oE 'POCKETBASE_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' src/lib/pocketbase-version.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$V" ]; then echo "Could not extract POCKETBASE_VERSION"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "PocketBase version: $V"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: docker/pocketbase
          file: docker/pocketbase/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            POCKETBASE_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/siteio-pocketbase:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/siteio-pocketbase:latest
          push: true
